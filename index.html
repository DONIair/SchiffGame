<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#123c42">
	<title>Gegen den Wind – Segelspiel</title>
	<style>
		:root {
			color-scheme: dark;
			--ocean-deep: #123c42;
			--ocean-mid: #1d5b5c;
			--ocean-light: #74bfaa;
			--foam: #e7f2dc;
			--sun: #f3c45d;
			--coral: #e77961;
			--ink: #15373a;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--foam);
			background-color: var(--ocean-deep);
			background-image: repeating-linear-gradient(165deg, transparent 0 42px, rgb(142 204 181 / 5%) 43px 44px, transparent 45px 82px);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
		}

		button, input { font: inherit; }

		.page {
			width: min(1120px, calc(100% - 40px));
			margin: 0 auto;
			padding: 34px 0 30px;
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: end;
			gap: 20px;
			margin-bottom: 20px;
		}

		.eyebrow, .label, .readout-label {
			color: #a4cbb8;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		h1 {
			margin: 5px 0 0;
			color: var(--foam);
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(30px, 5vw, 46px);
			font-weight: 400;
			line-height: 1;
		}

		.route-tag {
			display: flex;
			align-items: center;
			gap: 9px;
			padding-bottom: 3px;
			color: #d3e6cf;
			font-size: 13px;
		}

		.route-tag::before {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--sun);
			content: "";
		}

		.scene-wrap {
			position: relative;
			overflow: hidden;
			border: 1px solid rgb(214 237 211 / 25%);
			border-radius: 5px;
			background: #d0e4c4;
			box-shadow: 0 18px 50px rgb(4 24 28 / 24%);
		}

		canvas {
			display: block;
			width: 100%;
			aspect-ratio: 16 / 8.2;
		}

		.scene-status {
			position: absolute;
			top: 16px;
			left: 18px;
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 11px;
			border: 1px solid rgb(21 55 58 / 12%);
			border-radius: 3px;
			color: var(--ink);
			background: rgb(244 247 224 / 88%);
			font-size: 12px;
			font-weight: 700;
		}

		.status-dot {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: var(--coral);
		}

		.scene-status.moving .status-dot { background: #4a9b70; }

		.dashboard {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 220px;
			gap: 34px;
			align-items: center;
			padding: 23px 4px 0;
		}

		.trim-head, .readout-head {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 12px;
		}

		.trim-value {
			color: var(--sun);
			font-family: Georgia, "Times New Roman", serif;
			font-size: 27px;
		}

		.trim-value span { font-size: 15px; }

		.range-wrap { padding: 7px 0 0; }

		input[type="range"] {
			display: block;
			width: 100%;
			height: 24px;
			margin: 0;
			appearance: none;
			background: transparent;
			cursor: ew-resize;
			touch-action: pan-y;
		}

		input[type="range"]::-webkit-slider-runnable-track {
			height: 5px;
			border-radius: 5px;
			background: linear-gradient(to right, #e77961 0%, #e77961 15%, #f3c45d 30%, #9abf81 52%, #f3c45d 74%, #e77961 90%, #e77961 100%);
		}

		input[type="range"]::-moz-range-track {
			height: 5px;
			border-radius: 5px;
			background: linear-gradient(to right, #e77961, #f3c45d 30%, #9abf81 52%, #f3c45d 74%, #e77961);
		}

		input[type="range"]::-webkit-slider-thumb {
			width: 17px;
			height: 17px;
			margin-top: -6px;
			appearance: none;
			border: 3px solid var(--ocean-deep);
			border-radius: 50%;
			background: var(--foam);
			box-shadow: 0 0 0 2px var(--sun);
		}

		input[type="range"]::-moz-range-thumb {
			width: 12px;
			height: 12px;
			border: 3px solid var(--ocean-deep);
			border-radius: 50%;
			background: var(--foam);
			box-shadow: 0 0 0 2px var(--sun);
		}

		input[type="range"]:focus-visible { outline: 2px solid var(--sun); outline-offset: 5px; }

		.range-labels {
			display: flex;
			justify-content: space-between;
			color: #91b5a7;
			font-size: 11px;
		}

		.trim-hint {
			min-height: 18px;
			margin-top: 9px;
			color: #d4dfca;
			font-size: 12px;
		}

		.readouts {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 18px;
			border-left: 1px solid rgb(211 230 207 / 20%);
			padding-left: 24px;
		}

		.readout-value {
			display: block;
			margin-top: 5px;
			color: var(--foam);
			font-family: Georgia, "Times New Roman", serif;
			font-size: 25px;
		}

		.readout-value small { color: #a4cbb8; font-family: "Trebuchet MS", "Segoe UI", sans-serif; font-size: 11px; }

		.footer {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 18px;
			margin-top: 18px;
			border-top: 1px solid rgb(211 230 207 / 17%);
			padding-top: 14px;
			color: #a4cbb8;
			font-size: 12px;
		}

		.keys { color: #d7e5d6; }

		button {
			border: 1px solid rgb(211 230 207 / 36%);
			border-radius: 3px;
			padding: 8px 12px;
			color: var(--foam);
			background: transparent;
			cursor: pointer;
		}

		button:hover { border-color: var(--sun); color: var(--sun); }
		button:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }

		@media (max-width: 650px) {
			.page { width: min(100% - 24px, 520px); padding-top: 24px; }
			header { align-items: start; }
			.route-tag { max-width: 105px; font-size: 11px; }
			.scene-status { top: 9px; left: 9px; padding: 6px 8px; font-size: 10px; }
			canvas { aspect-ratio: 1.3 / 1; }
			.dashboard { grid-template-columns: 1fr; gap: 15px; padding: 16px 3px 0; }
			.readouts { border-top: 1px solid rgb(211 230 207 / 20%); border-left: 0; padding: 13px 0 0; }
			.footer { align-items: start; font-size: 11px; }
		}
	</style>
</head>
<body>
	<main class="page">
		<header>
			<div>
				<div class="eyebrow">Ein kleines Segelabenteuer</div>
				<h1>Gegen den Wind</h1>
			</div>
			<div class="route-tag">Kurs auf die Insel</div>
		</header>

		<section class="scene-wrap" aria-label="Segelspiel">
			<canvas id="sea" aria-label="Ein Segelboot fährt über das Meer auf eine Insel zu"></canvas>
			<div class="scene-status" id="status"><span class="status-dot"></span><span id="statusText">Segel steht still</span></div>
		</section>

		<section class="dashboard" aria-label="Segelsteuerung">
			<div>
				<div class="trim-head">
					<label class="label" for="trim">Segelstellung</label>
					<div class="trim-value"><span id="trimValue">38</span><span>°</span></div>
				</div>
				<div class="range-wrap">
					<input id="trim" type="range" min="15" max="75" value="38" aria-label="Segelwinkel">
					<div class="range-labels"><span>gefiert</span><span>angeholt</span></div>
				</div>
				<div class="trim-hint" id="hint" aria-live="polite">Stell das Segel ein, um Fahrt aufzunehmen.</div>
			</div>
			<div class="readouts">
				<div>
					<span class="readout-label">Wind</span>
					<span class="readout-value"><span id="windValue">NW</span> <small id="windStrength">12 kn</small></span>
				</div>
				<div>
					<span class="readout-label">Strecke</span>
					<span class="readout-value"><span id="distance">0</span><small> m</small></span>
				</div>
			</div>
		</section>

		<footer class="footer">
			<span class="keys">Pfeiltasten oder Regler: Segel trimmen</span>
			<button id="restart" type="button" title="Route neu starten">Neu starten</button>
		</footer>
	</main>

	<script>
		const canvas = document.querySelector("#sea");
		const context = canvas.getContext("2d");
		const trimControl = document.querySelector("#trim");
		const trimValue = document.querySelector("#trimValue");
		const distanceValue = document.querySelector("#distance");
		const hint = document.querySelector("#hint");
		const status = document.querySelector("#status");
		const statusText = document.querySelector("#statusText");
		const windValue = document.querySelector("#windValue");
		const windStrength = document.querySelector("#windStrength");

		const state = {
			trim: 38,
			hasTrimmed: false,
			progress: 0,
			windPhase: 0,
			lastTime: 0,
			width: 0,
			height: 0,
			pixelRatio: 1,
			wake: 0,
		};

		const routeLength = 1000;

		function resizeCanvas() {
			const bounds = canvas.getBoundingClientRect();
			state.width = bounds.width;
			state.height = bounds.height;
			state.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
			canvas.width = Math.round(bounds.width * state.pixelRatio);
			canvas.height = Math.round(bounds.height * state.pixelRatio);
			context.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
		}

		function roundedRect(x, y, width, height, radius, color) {
			context.fillStyle = color;
			context.beginPath();
			context.roundRect(x, y, width, height, radius);
			context.fill();
		}

		function drawScene(time) {
			const width = state.width;
			const height = state.height;
			if (!width || !height) return;
			context.clearRect(0, 0, width, height);

			const sky = context.createLinearGradient(0, 0, 0, height * 0.57);
			sky.addColorStop(0, "#c6dfbd");
			sky.addColorStop(1, "#f1e5b7");
			context.fillStyle = sky;
			context.fillRect(0, 0, width, height);

			context.fillStyle = "#f3c45d";
			context.beginPath();
			context.arc(width * 0.77, height * 0.2, Math.min(width, height) * 0.065, 0, Math.PI * 2);
			context.fill();

			context.fillStyle = "#a7c7a4";
			context.beginPath();
			context.moveTo(width * 0.62, height * 0.43);
			context.quadraticCurveTo(width * 0.72, height * 0.34, width * 0.83, height * 0.43);
			context.quadraticCurveTo(width * 0.9, height * 0.38, width, height * 0.43);
			context.lineTo(width, height * 0.55);
			context.lineTo(width * 0.62, height * 0.55);
			context.fill();

			const water = context.createLinearGradient(0, height * 0.42, 0, height);
			water.addColorStop(0, "#77b9a2");
			water.addColorStop(0.48, "#418f83");
			water.addColorStop(1, "#286a6c");
			context.fillStyle = water;
			context.fillRect(0, height * 0.43, width, height * 0.57);

			context.fillStyle = "#598f79";
			context.beginPath();
			context.moveTo(width * 0.88, height * 0.44);
			context.quadraticCurveTo(width * 0.95, height * 0.34, width * 1.03, height * 0.43);
			context.lineTo(width * 1.03, height * 0.47);
			context.lineTo(width * 0.88, height * 0.47);
			context.fill();

			const waveOffset = (state.progress * 1.35 + time * 0.012) % 76;
			for (let row = 0; row < 8; row += 1) {
				const y = height * (0.53 + row * 0.067);
				const spread = 12 + row * 12;
				context.beginPath();
				for (let x = -spread - waveOffset; x < width + spread; x += spread * 2.2) {
					context.moveTo(x, y + Math.sin(x * 0.012 + time * 0.001 + row) * 2);
					context.quadraticCurveTo(x + spread * 0.45, y - 3 - row * 0.18, x + spread, y);
				}
				context.strokeStyle = `rgba(226, 244, 211, ${0.22 - row * 0.014})`;
				context.lineWidth = 1.2;
				context.stroke();
			}

			const boatX = width * 0.31;
			const boatY = height * 0.7;
			const boatSize = Math.min(width, height) * 0.19;
			const rocking = Math.sin(time * 0.0017) * 2;
			const targetX = boatX + boatSize * (0.52 + (1 - state.progress / routeLength) * 1.48);

			context.save();
			context.setLineDash([5, 7]);
			context.strokeStyle = "rgba(241, 238, 191, .64)";
			context.lineWidth = 1.3;
			context.beginPath();
			context.moveTo(boatX + boatSize * 0.27, boatY + 2);
			context.lineTo(targetX, boatY + 2);
			context.stroke();
			context.restore();

			if (state.progress < routeLength) {
				context.fillStyle = "#e77961";
				context.beginPath();
				context.arc(targetX, boatY - boatSize * 0.06, Math.max(4, boatSize * 0.075), Math.PI, 0);
				context.lineTo(targetX + boatSize * 0.075, boatY + boatSize * 0.1);
				context.lineTo(targetX - boatSize * 0.075, boatY + boatSize * 0.1);
				context.fill();
				context.fillStyle = "#f4edcf";
				context.beginPath();
				context.arc(targetX, boatY - boatSize * 0.06, Math.max(1.5, boatSize * 0.025), 0, Math.PI * 2);
				context.fill();
			}

			context.save();
			context.translate(boatX, boatY + rocking);
			context.globalAlpha = 0.32;
			context.fillStyle = "#e5f0d7";
			context.beginPath();
			context.ellipse(-boatSize * 0.06, boatSize * 0.18, boatSize * 0.34, boatSize * 0.08, 0, 0, Math.PI * 2);
			context.fill();
			context.restore();

			context.save();
			context.translate(boatX, boatY + rocking);
			context.fillStyle = "#f3ead0";
			context.beginPath();
			context.moveTo(-boatSize * 0.56, 0);
			context.lineTo(-boatSize * 0.38, boatSize * 0.19);
			context.lineTo(boatSize * 0.34, boatSize * 0.19);
			context.lineTo(boatSize * 0.57, 0);
			context.closePath();
			context.fill();
			context.fillStyle = "#e77961";
			context.beginPath();
			context.moveTo(-boatSize * 0.48, boatSize * 0.13);
			context.lineTo(boatSize * 0.38, boatSize * 0.13);
			context.lineTo(boatSize * 0.5, 0);
			context.lineTo(-boatSize * 0.52, 0);
			context.closePath();
			context.fill();
			context.strokeStyle = "#15373a";
			context.lineWidth = 2;
			context.beginPath();
			context.moveTo(-boatSize * 0.06, 0);
			context.lineTo(-boatSize * 0.06, -boatSize * 0.77);
			context.stroke();
			context.fillStyle = "#f7f0d5";
			context.beginPath();
			context.moveTo(-boatSize * 0.1, -boatSize * 0.7);
			context.lineTo(-boatSize * 0.1, -boatSize * 0.05);
			context.lineTo(boatSize * (0.25 + state.trim / 130), -boatSize * 0.05);
			context.closePath();
			context.fill();
			context.fillStyle = "#e77961";
			context.beginPath();
			context.moveTo(-boatSize * 0.02, -boatSize * 0.07);
			context.lineTo(boatSize * (0.33 + state.trim / 135), -boatSize * 0.07);
			context.lineTo(-boatSize * 0.02, boatSize * 0.08);
			context.closePath();
			context.fill();
			roundedRect(-boatSize * 0.32, boatSize * 0.02, boatSize * 0.18, boatSize * 0.08, 3, "#a7c7a4");
			context.restore();

			if (state.progress >= routeLength) {
				context.fillStyle = "rgba(18, 60, 66, .72)";
				context.fillRect(0, 0, width, height);
				context.textAlign = "center";
				context.fillStyle = "#f3c45d";
				context.font = `bold ${Math.max(14, width * 0.027)}px Georgia`;
				context.fillText("Land in Sicht!", width / 2, height * 0.47);
				context.fillStyle = "#e7f2dc";
				context.font = `${Math.max(11, width * 0.014)}px Trebuchet MS`;
				context.fillText("Du hast den Kurs gehalten.", width / 2, height * 0.53);
			}
		}

		function updateInterface(efficiency) {
			trimValue.textContent = Math.round(state.trim);
			distanceValue.textContent = Math.floor(state.progress);
			const moving = efficiency > 0.12 && state.progress < routeLength;
			status.classList.toggle("moving", moving);
			statusText.textContent = state.progress >= routeLength ? "Insel erreicht" : moving ? "Du machst Fahrt" : "Segel steht still";
			if (state.progress >= routeLength) {
				hint.textContent = "Geschafft! Die Insel ist erreicht.";
			} else if (efficiency > 0.72) {
				hint.textContent = "Gute Fahrt! Der Wind greift ins Segel.";
			} else if (efficiency > 0.12) {
				hint.textContent = "Fast richtig. Trimm noch ein wenig nach.";
			} else {
				hint.textContent = "Kein Zug im Segel. Verstell den Winkel.";
			}
		}

		function animate(time) {
			if (!state.lastTime) state.lastTime = time;
			const delta = Math.min((time - state.lastTime) / 1000, 0.05);
			state.lastTime = time;

			state.windPhase += delta;
			const gust = Math.sin(state.windPhase * 0.42) * 12 + Math.sin(state.windPhase * 0.17) * 5;
			const idealTrim = 45 + gust;
			const error = Math.abs(state.trim - idealTrim);
			const efficiency = state.hasTrimmed ? Math.max(0, 1 - error / 24) : 0;
			if (state.progress < routeLength) state.progress = Math.min(routeLength, state.progress + efficiency * delta * 25);

			windValue.textContent = gust > 5 ? "NW" : gust < -5 ? "W" : "WNW";
			windStrength.textContent = `${Math.round(11 + (Math.sin(state.windPhase * 0.7) + 1) * 2)} kn`;
			updateInterface(efficiency);
			drawScene(time);
			requestAnimationFrame(animate);
		}

		trimControl.addEventListener("input", () => {
			state.trim = Number(trimControl.value);
			state.hasTrimmed = true;
		});

		document.addEventListener("keydown", (event) => {
			if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
			event.preventDefault();
			const change = event.key === "ArrowLeft" ? -2 : 2;
			trimControl.value = String(Math.max(15, Math.min(75, Number(trimControl.value) + change)));
			state.trim = Number(trimControl.value);
			state.hasTrimmed = true;
		});

		document.querySelector("#restart").addEventListener("click", () => {
			state.progress = 0;
			state.windPhase = 0;
			state.trim = 38;
			state.hasTrimmed = false;
			trimControl.value = "38";
		});

		window.addEventListener("resize", resizeCanvas);
		resizeCanvas();
		requestAnimationFrame(animate);
	</script>
</body>
</html>
